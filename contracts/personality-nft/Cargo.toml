[package]
name = "personality-nft"
version = "0.1.0"
edition = "2021"
publish = false
description = "NEP-171 personality NFT with an on-token character sheet anchor"
license = "MIT"
repository = "https://github.com/brandontomlin2/near-2026-hackathon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
