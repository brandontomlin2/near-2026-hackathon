[package]
name = "yield-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Per-personality-NFT trading vault with hard on-chain swap limits for Rhea (Ref Finance)"
license = "MIT"
repository = "https://github.com/brandontomlin2/near-2026-hackathon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
