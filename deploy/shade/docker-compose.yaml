services:
  yield-shade-agent:
    # UNCONFIRMED: image does not exist; we have not written the Dockerfile. Pin by digest (security.md).
    image: docker.io/REPLACE_ME/yield-shade-agent@sha256:REPLACE_ME
    container_name: yield-shade-agent
    # Confirmed in template: linux/amd64.
    platform: linux/amd64
    environment:
      # Safe defaults: the runtime must not sign or send unless both are explicitly changed.
      YIELD_SHADE_DRY_RUN: "1"
      NEAR_NETWORK: testnet
      # Confirmed names in the template (value from the deploy env file, not stored here):
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
