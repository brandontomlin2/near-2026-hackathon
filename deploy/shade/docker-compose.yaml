      VAULT_ID: ${VAULT_ID}
      EXECUTOR_ACCOUNT_ID: ${EXECUTOR_ACCOUNT_ID}
      DERIVATION_PATH: ${DERIVATION_PATH}
    ports:
      # Template exposes 3000. UNCONFIRMED whether our runtime needs an HTTP port at all.
      - 3000:3000
    volumes:
      # Confirmed in template: dstack socket (TEE quote + key derivation inside the CVM).
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: always
